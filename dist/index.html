<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="A social media platform for sharing and discovering beautiful spots and locations through images" />
        <meta name="author" content="Carlos Lobo" />
        <meta name="keywords" content="HTML, CSS, JavaScript, social media, photo sharing, spots, locations, image gallery" />
        <link rel="icon" type="image/x-icon" href="/assets/favicon-D1_pVfSE.ico" />
        <title>Spots</title>
      <link rel="stylesheet" crossorigin href="/assets/index-Ec4E1qRv.css">
    </head>
    <body>
        <div class="page">
            <header class="header">
                <img src="/assets/Logo-B5DQQ9-B.svg" alt="Spot Logo" class="header__logo" />
            </header>
            <main class="content">
                <section class="profile page__section">
                    <img src="/assets/avatar-D4km7fN_.jpg" alt="Avatar" class="profile__avatar" />
                    <div class="profile__column">
                        <h1 class="profile__name">Bessie Coleman</h1>
                        <p class="profile__description">Civil Aviator</p>
                        <button type="button" class="profile__edit-btn"><img src="data:image/svg+xml,%3csvg%20width='16'%20height='16'%20viewBox='0%200%2016%2016'%20fill='none'%20xmlns='http://www.w3.org/2000/svg'%3e%3crect%20x='13.0676'%20y='4.87506'%20width='11.6506'%20height='3.21396'%20transform='rotate(135%2013.0676%204.87506)'%20fill='%23212121'/%3e%3cpath%20d='M14.2036%201.4662C14.8312%202.09377%2014.8312%203.11125%2014.2036%203.73881L13.6354%204.30697L11.3628%202.03436L11.931%201.4662C12.5586%200.83864%2013.576%200.83864%2014.2036%201.4662Z'%20fill='%23212121'/%3e%3cpath%20d='M1.54021%2013.4837L2.55674%2010.8408L4.82935%2013.1134L2.18637%2014.1299C1.782%2014.2854%201.38468%2013.8881%201.54021%2013.4837Z'%20fill='%23212121'/%3e%3c/svg%3e" alt="Pencil" />Edit Profile</button>
                    </div>
                    <button type="button" class="profile__add-btn"><img src="data:image/svg+xml,%3csvg%20width='14'%20height='14'%20viewBox='0%200%2014%2014'%20fill='none'%20xmlns='http://www.w3.org/2000/svg'%3e%3cpath%20d='M1%207L13%207'%20stroke='%23FCF5E5'%20stroke-width='2'%20stroke-linecap='round'/%3e%3cpath%20d='M7%2013L7%201'%20stroke='%23FCF5E5'%20stroke-width='2'%20stroke-linecap='round'/%3e%3c/svg%3e" alt="Plus icon" />New Post</button>
                </section>
                <section class="cards page__section">
                    <ul class="cards__list">
                        <template id="card-template">
                            <li class="card">
                                <button type="button" class="card__delete-btn"></button>
                                <img class="card__image" src="" alt="" />
                                <div class="card__content">
                                    <h2 class="card__title"></h2>
                                    <button aria-label="Like card" class="card__like-button" type="button"></button>
                                </div>
                            </li>
                        </template>
                    </ul>
                </section>
            </main>
            <footer class="footer">
                <h3 class="footer__text">2025 © Spots</h3>
            </footer>
            <div class="modal" id="edit-modal">
                <div class="modal__container">
                    <button type="button" class="modal__close-btn"></button>
                    <h2 class="modal__title">Edit profile</h2>
                    <form name="edit-profile" class="modal__form" novalidate>
                        <label for="profile-name-input" class="modal__label">
                            Name
                            <input id="profile-name-input" type="text" class="modal__input" placeholder="Type your name" required minlength="2" maxlength="40" />
                            <span  id="profile-name-input-error" class="modal__error"></span>
                        </label>
                        <label for="profile-description-input" class="modal__label">
                            Description
                            <input id="profile-description-input" type="text" class="modal__input" placeholder="Describe yourself" required minlength="2" maxlength="200" />
                            <span id="profile-description-input-error"  class="modal__error"></span>
                        </label>
                        <button type="submit" class="modal__submit-btn">Save</button>
                    </form>
                </div>
            </div>

            <div class="modal" id="add-card-modal">
                <div class="modal__container">
                    <button type="button" class="modal__close-btn"></button>
                    <h2 class="modal__title">New Post</h2>
                    <form id="add-card-form" class="modal__form" novalidate>
                        <label for="add-card-link-input" class="modal__label">
                            Image link
                            <input id="add-card-link-input" type="url" class="modal__input" placeholder="Paste a link to the picture" required />
                            <span id="add-card-link-input-error" class="modal__error"></span>
                        </label>
                        <label for="add-card-name-input" class="modal__label">
                            Caption
                            <input id="add-card-name-input" type="text" class="modal__input" placeholder="Type your caption" required minlength="2" maxlength="30" />
                            <span id="add-card-name-input-error" class="modal__error"></span>
                        </label>
                        <button type="submit" class="modal__submit-btn">Save</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="modal" id="preview-modal">
            <div class="modal__container modal__container_type_preview">
                <button aria-label="Close modal" class="modal__close-btn modal__close-btn_type_preview" type="button"></button>
                <img class="modal__image" src="https://practicum-content.s3.us-west-1.amazonaws.com/software-engineer/spots/7-photo-by-griffin-wooldridge-from-pexels.jpg" alt="Landscape view" />
                <p class="modal__caption"></p>
            </div>
        </div>
        <script defer src="./scripts/validation.js"></script>
        <script defer src="./scripts/index.js"></script>
        
    </body>
</html>
